<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetPortal - Community Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Retro Header Banner -->
    <header class="app-header">
        <div class="header-inner">
            <div class="brand">
                <span class="site-title">NetPortal</span>
                <span class="site-sub">Personal Network & Community Hub</span>
            </div>
            <nav id="nav-area" class="nav-area hidden">
                [<a href="#" id="nav-feed">Feed</a>]
                [<a href="#" id="nav-profile">My Board</a>]
                [<a href="#" id="nav-directory">Directory</a>]
                [<a href="#" id="nav-notifs">Notifications <span id="notif-count" class="badge">0</span></a>]
                [<a href="#" id="nav-dev">Developer</a>]
                [<a href="#" id="nav-logout" class="logout-link">Logout</a>]
            </nav>
        </div>
    </header>

    <hr class="header-divider">

    <div class="main-container">
        <div id="alert-box" class="alert-box hidden"></div>

        <!-- VIEW 1: AUTHENTICATION -->
        <main id="auth-view" class="view">
            <div class="auth-box">
                <div class="auth-header">System Access / Member Login</div>
                <div class="auth-tables">
                    <!-- Login -->
                    <form id="login-form">
                        <table class="form-table">
                            <tr>
                                <td colspan="2" class="table-header">Login</td>
                            </tr>
                            <tr>
                                <td class="label">Username</td>
                                <td><input type="text" id="login-user" required autocomplete="username"></td>
                            </tr>
                            <tr>
                                <td class="label">Password</td>
                                <td><input type="password" id="login-pass" required autocomplete="current-password">
                                </td>
                            </tr>
                            <tr>
                                <td></td>
                                <td><button type="submit" class="retro-btn">Log In</button></td>
                            </tr>
                        </table>
                    </form>

                    <!-- Register -->
                    <form id="register-form">
                        <table class="form-table">
                            <tr>
                                <td colspan="2" class="table-header">New Registration</td>
                            </tr>
                            <tr>
                                <td class="label">Username</td>
                                <td><input type="text" id="reg-user" required autocomplete="username"></td>
                            </tr>
                            <tr>
                                <td class="label">Password</td>
                                <td><input type="password" id="reg-pass" required autocomplete="new-password"></td>
                            </tr>
                            <tr>
                                <td class="label">Bio / Status</td>
                                <td><input type="text" id="reg-bio" placeholder="e.g. CS Student (Type > to quote)"
                                        required></td>
                            </tr>
                            <tr>
                                <td></td>
                                <td><button type="submit" class="retro-btn">Create Account</button></td>
                            </tr>
                        </table>
                    </form>
                </div>
            </div>
        </main>

        <!-- VIEW 2: MAIN BOARD -->
        <main id="app-view" class="view hidden">
            <div id="view-content"></div>
        </main>

        <hr class="header-divider">
        <footer class="app-footer">
            NetPortal Community Hub &bull; Realtime Database System
        </footer>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
